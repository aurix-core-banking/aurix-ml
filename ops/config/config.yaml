training:
  model_name: fraud_detection
  sample_size: 5000
  test_size: 0.2
  random_state: 42
  target_column: is_fraud

# Pipeline de treino do modelo de risco de credito (models/train_credit_pipeline.py)
credit_training:
  model_name: credit_risk
  sample_size: 5000
  random_state: 42
  target_column: inadimplente
  regime: r3
  governance_samples: 200
  mlflow:
    tracking_uri: "http://localhost:5000"
    experiment_name: "aurix-credit-risk"
    registry_model_name: "aurix-credit-risk"

serving:
  host: "0.0.0.0"
  port: 8000
  model_path: "models/fraud_detection_model.pkl"
  timeout_seconds: 30
  max_batch_size: 100

mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "aurix-fraud-detection"
  registry_model_name: "aurix-fraud-detection"

monitoring:
  drift_threshold: 0.15
  min_samples_drift: 500
  check_interval_hours: 24
  metrics_window_days: 7
  # Model drift
  model_drift_threshold: 0.1
  model_baseline_file: "artifacts/model_baseline_metrics.json"
  # Alertas
  alerting:
    slack_webhook_env: "ML_SLACK_WEBHOOK_URL"
    email_to_env: "ML_ALERTAS_EMAIL_TO"
  # Exporter Prometheus para o Grafana
  exporter:
    port: 9101
  # Retreino automático
  retraining:
    enabled: true
    promote_to_production: true

storage:
  models_dir: "models"
  artifacts_dir: "artifacts"
  metrics_dir: "metrics"
